services:

  # ==========================================
  # PostgreSQL - stores Keycloak configuration
  # ==========================================
  keycloak-postgres:
    image: postgres:16
    container_name: keycloak-postgres2
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data2:/var/lib/postgresql/data2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Keycloak OAuth Server
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: keycloak2
    restart: unless-stopped
    command: start-dev
    environment:
      # Keycloak admin credentials
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # Internal Database connection parameters
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy


  # ==========================================
  # PostgreSQL - Application Core Database
  # ==========================================
  banking-postgres:
    image: postgres:15
    container_name: banking-postgres
    environment:
      POSTGRES_DB: bankingdb
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in techbleat-global-bank-backend/.env}
    ports:
      - "5432:5432"
    volumes:
      #- postgres_data:/var/lib/postgresql/data
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql

  # ==========================================
  # Cache Engine
  # ==========================================
  redis:
    image: redis:7
    container_name: banking-redis
    ports:
      - "6379:6379"

  # ==========================================
  # Distributed Messaging Queue
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:8.1.1
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  # ==========================================
  # Microservices
  # ==========================================
  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      DATABASE_URL: postgresql://bankuser:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in techbleat-global-bank-backend/.env}@banking-postgres:5432/bankingdb
      FRONTEND_ORIGIN: http://localhost:3000
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://host.docker.internal:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-banking}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-banking-provisioner}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      - banking-postgres

  transaction-service:
    build: ./transaction-service
    container_name: transaction-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://banking-postgres:5432/bankingdb
      SPRING_DATASOURCE_USERNAME: bankuser
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in techbleat-global-bank-backend/.env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8090:8080"
    depends_on:
      - banking-postgres
      - kafka
      - redis

  activity-service:
    build: ./activity-service
    container_name: activity-service
    environment:
      DATABASE_URL: postgresql://bankuser:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in techbleat-global-bank-backend/.env}@banking-postgres:5432/bankingdb
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8001:8001"
    depends_on:
      - banking-postgres
      - kafka

  finance-agent:
    build:
      context: ../finance-agent
    container_name: finance-agent
    env_file:
      - path: ../finance-agent/.env
        required: false
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://host.docker.internal:8080}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://kunleoyeleye-bank.com/realms/banking}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-banking}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-account}
      TRANSACTION_API_URL: http://transaction-service:8080
    depends_on:
      - transaction-service
    ports:
      - "9001:9001"

  frontend:
    build:
      context: ../techbleat-global-bank-frontend
      dockerfile: dockerfile
    container_name: frontend
    image: frontend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  postgres_data2:
