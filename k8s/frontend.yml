apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-frontend
  namespace: banking
  labels:
    app: bank-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-frontend
  template:
    metadata:
      labels:
        app: bank-frontend
    spec:
      containers:
      - name: frontend
        image: bank-frontend:v1 
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"