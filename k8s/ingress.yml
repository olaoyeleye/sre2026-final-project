# =====================================================================
# Public routing (TLS terminated at Traefik)
#
# Requires:
#   - ingress-controller.yml applied
#   - cert-manager installed with a ClusterIssuer named "letsencrypt-prod"
#     (or remove the annotation and create the "banking-tls" secret yourself)
#   - DNS A/AAAA records for every host below pointing at the Traefik
#     LoadBalancer address
#
# Each backend gets its own sub-domain so no path rewriting is needed.
# Build the frontend with these URLs.
# =====================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking
  namespace: banking
  labels:
    app.kubernetes.io/part-of: techbleat-bank
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kunleoyeleye-bank.com
        - auth.kunleoyeleye-bank.com
        - users.kunleoyeleye-bank.com
        - transactions.kunleoyeleye-bank.com
        - activity.kunleoyeleye-bank.com
        - agent.kunleoyeleye-bank.com
      secretName: banking-tls
  rules:
    # SPA
    - host: kunleoyeleye-bank.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
    # Keycloak (issuer: https://auth.kunleoyeleye-bank.com/realms/banking)
    - host: auth.kunleoyeleye-bank.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
    # User API
    - host: users.kunleoyeleye-bank.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  name: http
    # Transaction API
    - host: transactions.kunleoyeleye-bank.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transaction-service
                port:
                  name: http
    # Activity API
    - host: activity.kunleoyeleye-bank.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: activity-service
                port:
                  name: http
    # Finance agent API
    - host: agent.kunleoyeleye-bank.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finance-agent
                port:
                  name: http
