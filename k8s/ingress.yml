---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress-nginx
  namespace: banking
  annotations:
    # Large header buffers for Keycloak 26
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"
spec:
  ingressClassName: nginx
  rules:
  # No host set, so this matches the load balancer hostname.
  # When you have a domain, add:  - host: app.yourdomain.com
  - host: kunleoyeleye-bank.com
    http:
      paths:
      # Backend APIs
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8080
      - path: /transactions
        pathType: Prefix
        backend:
          service:
            name: transaction-service
            port:
              number: 8080
      - path: /activities
        pathType: Prefix
        backend:
          service:
            name: activity-service
            port:
              number: 8080

      # Keycloak routes
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /realms
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /resources
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /js
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /v2
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080

      # Frontend (catch-all, keep last)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bank-frontend
            port:
              number: 3000