---
# Ingress 1: Keycloak + frontend (no path rewriting)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress-nginx
  namespace: banking
  annotations:
    # Large header buffers for Keycloak 26
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"
    nginx.ingress.kubernetes.io/proxy-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: kunleoyeleye-bank.com
    http:
      paths:
      # Keycloak routes
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /realms
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /resources
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /js
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
      - path: /v2
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080

      # Frontend (catch-all, keep last)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bank-frontend
            port:
              number: 3000
---
# Ingress 2: backend APIs. The frontend calls /user-api, /transaction-api,
# /activity-api and /finance-agent-api; the prefix is stripped before
# the request reaches the service (same as the vite dev proxy).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-api-ingress
  namespace: banking
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
spec:
  ingressClassName: nginx
  rules:
  - host: kunleoyeleye-bank.com
    http:
      paths:
      - path: /user-api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: user-service
            port:
              number: 8080
      - path: /transaction-api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: transaction-service
            port:
              number: 8080
      - path: /activity-api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: activity-service
            port:
              number: 8080
      - path: /finance-agent-api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: finance-agent
            port:
              number: 8080