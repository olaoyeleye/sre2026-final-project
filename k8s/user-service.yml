---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: user-service:v1
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: BANKING_DB_URL
        - name: FRONTEND_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: FRONTEND_ORIGIN
        - name: KEYCLOAK_URL
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KEYCLOAK_URL
        - name: KEYCLOAK_REALM
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KEYCLOAK_REALM
        - name: KEYCLOAK_ADMIN_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KEYCLOAK_ADMIN_CLIENT_ID
        - name: KEYCLOAK_ADMIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: KEYCLOAK_ADMIN_CLIENT_SECRET
        ports:
        - containerPort: 8000