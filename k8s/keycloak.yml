apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: banking
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.3.5
        args: ["start-dev"]
        env:
        # Keycloak 26 Reverse Proxy & Host Parameters
        - name: KC_PROXY_HEADERS
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_PROXY_HEADERS
        - name: KC_HTTP_ENABLED
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_HTTP_ENABLED
        - name: KC_HOSTNAME_STRICT
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_HOSTNAME_STRICT
        - name: KC_HTTP_RELATIVE_PATH
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_HTTP_RELATIVE_PATH
        - name: KC_HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_HOSTNAME

        # Keycloak 26 Bootstrap Admin Credentials
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: KC_BOOTSTRAP_ADMIN_USERNAME
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: KC_BOOTSTRAP_ADMIN_PASSWORD

        # PostgreSQL Configuration Matrix
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KEYCLOAK_DB_URL
        - name: KC_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KEYCLOAK_DB_USER
        - name: KC_DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KEYCLOAK_DB_PASSWORD
        ports:
        - containerPort: 8080
          name: http
        
        # AUTOMATED REALM INITIALIZATION ENGINE
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                # 1. Loop until Keycloak's HTTP port is open and fully operational
                until curl -s http://localhost:8080/admin/master/console/ > /dev/null; do 
                  sleep 3
                done
                
                # 2. Authenticate against the core loopback engine to grab an access token
                TOKEN=$(curl -s -X POST "http://localhost:8080/realms/master/protocol/openid-connect/token" \
                  -d "username=admin" -d "password=admin" -d "grant_type=password" -d "client_id=admin-cli" \

                  | grep -o '"access_token":"[^"]*' | grep -o '[^"]*$')
                
                # 3. Request the creation of the missing 'banking' realm
                curl -s -X POST "http://localhost:8080/admin/realms" \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  -d '{"realm": "banking", "enabled": true, "displayName": "Techbleat Global Banking"}'
