apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: banking
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.3.5
        args: ["start-dev"]
        env:
        # Keycloak 26 Reverse Proxy & Host Parameters (Sourced from ConfigMap)
        - name: KC_PROXY_HEADERS
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_PROXY_HEADERS
        - name: KC_HTTP_ENABLED
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_HTTP_ENABLED
        - name: KC_HOSTNAME_STRICT
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_HOSTNAME_STRICT
        - name: KC_HTTP_RELATIVE_PATH
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_HTTP_RELATIVE_PATH
        - name: KC_HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_HOSTNAME

        # Keycloak 26 Bootstrap Admin Credentials
        - name: KC_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: KEYCLOAK_ADMIN_USERNAME
        - name: KC_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: KEYCLOAK_ADMIN_PASSWORD

        # PostgreSQL Configuration Matrix (FIXED: Property targets optimized for Quarkus)
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KEYCLOAK_DB_URL
        - name: KC_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KEYCLOAK_DB_USER
        - name: KC_DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KEYCLOAK_DB_PASSWORD
        ports:
        - containerPort: 8080
          name: http
