---
# Realm definition imported at startup (only if the realm does not exist yet).
# ${FRONTEND_ORIGIN} and ${KEYCLOAK_ADMIN_CLIENT_SECRET} are replaced by Keycloak
# with the container's environment variables, which come from banking-config
# and banking-secrets below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-realm
  namespace: banking
data:
  banking-realm.json: |
    {
      "realm": "banking",
      "enabled": true,
      "displayName": "Techbleat Global Banking",
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "roles": {
        "realm": [
          { "name": "banking-customer" },
          { "name": "banking-transact" },
          { "name": "banking-ai-agent" }
        ]
      },
      "clients": [
        {
          "clientId": "banking-frontend",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": ["${FRONTEND_ORIGIN}/*"],
          "webOrigins": ["${FRONTEND_ORIGIN}"],
          "attributes": { "pkce.code.challenge.method": "S256" }
        },
        {
          "clientId": "banking-provisioner",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "${KEYCLOAK_ADMIN_CLIENT_SECRET}",
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        }
      ],
      "users": [
        {
          "username": "service-account-banking-provisioner",
          "enabled": true,
          "serviceAccountClientId": "banking-provisioner",
          "clientRoles": {
            "realm-management": ["manage-users", "view-users", "query-users", "view-realm"]
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: banking
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.3.5
        args: ["start-dev", "--import-realm"]
        env:
        # Reverse proxy, hostname (this is what sets the token issuer) - from ConfigMap
        - name: KC_PROXY_HEADERS
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_PROXY_HEADERS
        - name: KC_HTTP_ENABLED
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_HTTP_ENABLED
        - name: KC_HOSTNAME_STRICT
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_HOSTNAME_STRICT
        - name: KC_HTTP_RELATIVE_PATH
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_HTTP_RELATIVE_PATH
        - name: KC_HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KC_HOSTNAME

        # Bootstrap admin - from Secret
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: KEYCLOAK_ADMIN_USERNAME
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: KEYCLOAK_ADMIN_PASSWORD

        # Values substituted into the realm file
        - name: FRONTEND_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: FRONTEND_ORIGIN
        - name: KEYCLOAK_ADMIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: banking-secrets
              key: KEYCLOAK_ADMIN_CLIENT_SECRET

        # PostgreSQL
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KEYCLOAK_DB_URL
        - name: KC_DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KEYCLOAK_DB_USER
        - name: KC_DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: banking-config
              key: KEYCLOAK_DB_PASSWORD
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
        volumeMounts:
        - name: realm-import
          mountPath: /opt/keycloak/data/import
          readOnly: true
      volumes:
      - name: realm-import
        configMap:
          name: banking-realm