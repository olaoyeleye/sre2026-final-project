# =====================================================================
# "banking" realm, imported automatically by Keycloak at start-up
# (keycloak.yml runs "start --import-realm").
#
# - Import is skipped if the realm already exists, so it never overwrites
#   changes made in the admin console.
# - ${KEYCLOAK_ADMIN_CLIENT_SECRET} is filled in from the environment
#   (user-service-secret), so the provisioner secret never lives in Git
#   and Keycloak and user-service always agree on it.
#
# Matches what the code expects (README + src/auth.js + user-service):
#   banking-frontend    public client, PKCE S256
#   banking-provisioner confidential client, service account with
#                       realm-management manage-users
#   roles               banking-customer, banking-transact, banking-ai-agent
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: banking
  labels:
    app.kubernetes.io/part-of: techbleat-bank
data:
  banking-realm.json: |
    {
      "realm": "banking",
      "enabled": true,
      "sslRequired": "external",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "bruteForceProtected": true,
      "roles": {
        "realm": [
          { "name": "banking-customer", "description": "Can view own accounts" },
          { "name": "banking-transact", "description": "Can deposit, withdraw and transfer" },
          { "name": "banking-ai-agent", "description": "Can use the AI assistant" }
        ]
      },
      "clients": [
        {
          "clientId": "banking-frontend",
          "name": "Techbleat Global Bank",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "rootUrl": "https://kunleoyeleye-bank.com",
          "baseUrl": "/",
          "redirectUris": ["https://kunleoyeleye-bank.com/*"],
          "webOrigins": ["https://kunleoyeleye-bank.com"],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://kunleoyeleye-bank.com/*##https://kunleoyeleye-bank.com"
          }
        },
        {
          "clientId": "banking-provisioner",
          "name": "Banking user provisioner",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "${KEYCLOAK_ADMIN_CLIENT_SECRET}",
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true
        }
      ],
      "users": [
        {
          "username": "service-account-banking-provisioner",
          "enabled": true,
          "serviceAccountClientId": "banking-provisioner",
          "clientRoles": {
            "realm-management": ["manage-users", "view-users", "query-users"]
          }
        }
      ]
    }
