# =====================================================================
# Apache Kafka (Confluent cp-kafka 8.1.1) - 3-node KRaft cluster
# Each pod is both broker and controller. Replication factor 3,
# min.insync.replicas 2, so one broker can be lost without data loss.
#
# If you change "replicas", update KAFKA_CONTROLLER_QUORUM_VOTERS too.
# Generate your own CLUSTER_ID for a new cluster:
#   docker run --rm confluentinc/cp-kafka:8.1.1 kafka-storage random-uuid
# =====================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka
  namespace: banking
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: techbleat-bank
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: banking
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: techbleat-bank
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel     # all controllers must start together to form quorum
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: techbleat-bank
    spec:
      serviceAccountName: kafka
      automountServiceAccountToken: false
      # Required: a Service named "kafka" would otherwise inject KAFKA_PORT etc.
      # env vars that the Confluent image tries to parse as broker config.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kafka
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:8.1.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              ORDINAL="${HOSTNAME##*-}"
              export KAFKA_NODE_ID=$((ORDINAL + 1))
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka-headless.banking.svc.cluster.local:29092"
              exec /etc/confluent/docker/run
          env:
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-headless.banking.svc.cluster.local:29093,2@kafka-1.kafka-headless.banking.svc.cluster.local:29093,3@kafka-2.kafka-headless.banking.svc.cluster.local:29093"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data/kraft-logs"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "3000"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms1g -Xmx1g"
          ports:
            - name: client
              containerPort: 29092
            - name: controller
              containerPort: 29093
          startupProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: kafka
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: <your-ssd-class>
        resources:
          requests:
            storage: 20Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka
  namespace: banking
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
  namespace: banking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes:
    - Ingress
  ingress:
    # Broker <-> broker and controller quorum traffic
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - port: 29092
          protocol: TCP
        - port: 29093
          protocol: TCP
    # Producers / consumers
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: transaction-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: activity-service
      ports:
        - port: 29092
          protocol: TCP
