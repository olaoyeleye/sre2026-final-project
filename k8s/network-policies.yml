# =====================================================================
# Allowed inbound paths for the app pods (default-deny is in ns.yml;
# Postgres / Kafka / Redis carry their own policies in their files).
#
#   traefik  -> frontend, keycloak
#   frontend (nginx proxy) -> user, transaction, activity, finance-agent
#   user-service, finance-agent -> keycloak (token, admin API, JWKS)
#   finance-agent -> transaction-service
# =====================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: banking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 80
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: banking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: user-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: finance-agent
      ports:
        - port: 8080
          protocol: TCP
    # Keycloak cluster traffic between its own pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - port: 7800
          protocol: TCP
        - port: 57800
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-service
  namespace: banking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: user-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: transaction-service
  namespace: banking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: transaction-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: finance-agent
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: activity-service
  namespace: banking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: activity-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - port: 8001
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-agent
  namespace: banking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: finance-agent
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - port: 9001
          protocol: TCP
