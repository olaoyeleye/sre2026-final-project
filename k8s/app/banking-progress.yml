# =====================================================================
# PostgreSQL 15 - Application core database (bankingdb)
# Unlike the compose file, data is now persisted on a volume.
# Single instance; for HA use a managed DB or CloudNativePG.
# =====================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-postgres
  namespace: banking
  labels:
    app.kubernetes.io/name: banking-postgres
    app.kubernetes.io/part-of: techbleat-bank
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: banking-postgres
  namespace: banking
  labels:
    app.kubernetes.io/name: banking-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: techbleat-bank
spec:
  serviceName: banking-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: banking-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: banking-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: techbleat-bank
        # Data stores stay outside the mesh; NetworkPolicy below guards them
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: banking-postgres
      # Runs only on the tainted "data" node group
      nodeSelector:
        workload: data
      tolerations:
        - key: dedicated
          operator: Equal
          value: data
          effect: NoSchedule
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: bankingdb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: banking-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d bankingdb -h 127.0.0.1']
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d bankingdb -h 127.0.0.1']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d bankingdb -h 127.0.0.1']
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: init-scripts
          configMap:
            name: banking-db-init
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: banking-postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: <your-ssd-class>
        resources:
          requests:
            storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banking-postgres
  namespace: banking
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: banking-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: user-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: transaction-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: activity-service
      ports:
        - port: 5432
          protocol: TCP
