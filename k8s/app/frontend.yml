# =====================================================================
# Frontend (React SPA served by nginx, port 80) - image built from
# techbleat-global-bank-frontend/dockerfile, unchanged.
#
# The SPA calls relative paths (/user-api, /transaction-api, ...) and
# Keycloak at VITE_KEYCLOAK_URL (baked in at build time). The Istio
# gateway routes all of those, so the browser only ever talks to
# https://kunleoyeleye-bank.com.
# =====================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: banking
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: techbleat-bank
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: banking
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: techbleat-bank
spec:
  # No "replicas": the HPA owns the replica count
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: techbleat-bank
    spec:
      serviceAccountName: frontend
      nodeSelector:
        workload: apps     # "apps" node group
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      containers:
        - name: frontend
          image: 229378727509.dkr.ecr.eu-west-1.amazonaws.com/frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /frontend-health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /frontend-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          # nginx:1.27-alpine starts as root, then drops to the nginx user
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: banking
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: banking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
