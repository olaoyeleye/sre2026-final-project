---
# apiVersion: v1
# kind: Service
# metadata:
#   name: bank-frontend
#   namespace: banking
# spec:
#   type: ClusterIP
#   ports:
#     - protocol: TCP
#       port: 3000
#       targetPort: 3000   
#   selector:
#     app: bank-frontend   


apiVersion: v1
kind: Service
metadata:
  name: bank-frontend
  namespace: banking
  labels:
    app: bank-frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000       # Keep this at 3000 since your Ingress expects 3000
    targetPort: 80   # FIX: Updated from 3000 to match internal container NGINX port 80
    protocol: TCP
    name: http
  selector:
    app: bank-frontend
