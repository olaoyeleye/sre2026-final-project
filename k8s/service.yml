# apiVersion: v1
# kind: Service
# metadata:
#   name: banking-postgres
#   namespace: banking
# spec:
#   ports:
#   - port: 5432
#     targetPort: 5432
#   selector:
#     app: banking-postgres
#   type: ClusterIP


apiVersion: v1
kind: Service
metadata:
  name: banking-postgres-service
  namespace: banking
  labels:
    app: banking-postgres
spec:
  clusterIP: None # Defines it as a headless service for the StatefulSet
  ports:
  - port: 5432
    name: postgres
  selector:
    app: banking-postgres



---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres-service
  namespace: banking
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: keycloak-postgres
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: banking
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
  type: ClusterIP


#messaging service
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: banking
spec:
  ports:
  - name: tcp-kafka
    port: 9092
    targetPort: 9092
  - name: tcp-jmx
    port: 9101
    targetPort: 9101
  selector:
    app: kafka
  type: ClusterIP

 
