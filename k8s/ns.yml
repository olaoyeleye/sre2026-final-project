# =====================================================================
# Namespace + baseline guard-rails for the whole banking stack
# Apply this FIRST.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: banking
  labels:
    app.kubernetes.io/part-of: techbleat-bank
    # Enforce "baseline", warn/audit on "restricted".
    # (The nginx-based frontend image needs a few capabilities, so it
    #  cannot run under "restricted" enforcement.)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
# Default requests/limits for any container that forgets to set them
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: banking
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        memory: 512Mi
---
# Cap on what the namespace can consume in total
apiVersion: v1
kind: ResourceQuota
metadata:
  name: banking-quota
  namespace: banking
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.memory: 48Gi
    persistentvolumeclaims: "10"
    requests.storage: 200Gi
    services.loadbalancers: "0"   # only the ingress controller gets a public LB
---
# Zero-trust default: deny ALL inbound traffic to every pod in the namespace.
# Each component file adds its own NetworkPolicy allowing only what it needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: banking
spec:
  podSelector: {}
  policyTypes:
    - Ingress
