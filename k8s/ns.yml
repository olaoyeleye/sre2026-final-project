# =====================================================================
# Namespace + guard-rails for the banking stack
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: banking
  labels:
    app.kubernetes.io/part-of: techbleat-bank
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: banking
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: banking-quota
  namespace: banking
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.memory: 48Gi
    persistentvolumeclaims: "10"
    requests.storage: 200Gi
    services.loadbalancers: "0"   # the ONLY load balancer is Traefik's (traefik namespace)
---
# Deny all inbound traffic by default; each manifest allows what it needs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: banking
spec:
  podSelector: {}
  policyTypes:
    - Ingress
