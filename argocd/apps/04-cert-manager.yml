# Wave -1: cert-manager (issues the Let's Encrypt certificate for the gateway)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: banking
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.19.3
    helm:
      valuesObject:
        crds:
          enabled: true
        nodeSelector:
          workload: system
        webhook:
          nodeSelector:
            workload: system
        cainjector:
          nodeSelector:
            workload: system
        startupapicheck:
          nodeSelector:
            workload: system
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
